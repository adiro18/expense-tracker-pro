# Non-secret configuration. DB_HOST is filled in by scripts/deploy.sh from
# `terraform output -raw rds_endpoint` (or edit it by hand).
apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-config
  labels:
    app: spendwise
data:
  APP_ENV: "production"
  DB_HOST: "REPLACE_WITH_RDS_ENDPOINT"
  DB_PORT: "3306"
  DB_NAME: "spendwise"
  DEFAULT_CURRENCY: "INR"
  FLASK_APP: "wsgi.py"
